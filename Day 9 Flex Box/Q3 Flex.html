
<!DOCTYPE html>
<html>
<head>
    <title>Vertical Navigation</title>
    <style>
        .navbar {
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            width: 200px;
            height: 300px;
            background-color: lightblue;
            padding: 10px;
        }
        .navbar a{
            color: black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
        <a href="#">Login</a>
    </nav>
</body>
</html>
