
<!DOCTYPE html>
<html>
<head>
    <title>Responsive Row to Column</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            gap: 20px;
        }

        .box {
            flex: 1;
            padding: 40px;
            background-color: skyblue;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>
</body>
</html>
