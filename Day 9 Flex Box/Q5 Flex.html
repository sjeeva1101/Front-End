
<!DOCTYPE html>
<html>
<head>
    <title>Align Items Bottom</title>
    <style>
        .container {
            display: flex;
            align-items: flex-end;
            gap: 20px;
            height: 300px;
            background-color: lightgray;
        }

        .box {
            width: 100px;
            background-color: orange;
            text-align: center;
        }

        .box1 {
            height: 70px;
        }

        .box2 {
            height: 180px;
        }

        .box3 {
            height: 140px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
    </div>
</body>
</html>
