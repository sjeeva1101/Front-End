
<!DOCTYPE html>
<html>
<head>
    <title>Card Layout</title>
    <style>
        .container {
            display: flex;
            justify-content: space-evenly;
            gap: 20px;
        }

        .card {
            width: 200px;
            padding: 20px;
            background-color: lightgreen;
            border: 2px solid green;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h3>Card 1</h3>
            <p>First Card</p>
        </div>

        <div class="card">
            <h3>Card 2</h3>
            <p>Second Card</p>
        </div>

        <div class="card">
            <h3>Card 3</h3>
            <p>Third Card</p>
        </div>
    </div>
</body>
</html>
