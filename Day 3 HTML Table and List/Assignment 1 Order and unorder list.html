<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordered and Unordered List</title>
</head>
<body style="background-color: bisque;">
    <h2>Shopping List</h2>
    <ul type="Square">
        <li>Egg</li>
        <li>Milk</li>
        <li>Rice</li>
        <li>Bread</li>
    </ul>
    <h2>Steps To Make Tea</h2>
    <ol type="I">
        <li>Boil Water</li>
        <li>Add tea powder</li>
        <li>Add milk and sugar</li>
        <li>Filter and serve</li>
    </ol>
</body>
</html>
