<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style5.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <h2>Admin</h2>
            <p>Dashboard</p>
            <p>Users</p>
            <p>Settings</p>

            </div>
        </main>
    </div>
