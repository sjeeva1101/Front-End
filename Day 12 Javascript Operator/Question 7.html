<body>
    <h1>Grade Evaluation System</h1>
    <script>
        let mark = 72;
        if (mark >= 0 && mark <= 100)
    {
        if(mark >= 90 && mark <= 100)
    {
        console.log('Grade A');
    }
        else if(mark >= 75 && mark <= 89){
            console.log('Grade B');
        }
        else if(mark >= 50 && mark <= 74){

        }
            else{
            console.log('Fail');
        }
    }
    </script>
