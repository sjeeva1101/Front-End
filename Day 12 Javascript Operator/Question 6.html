<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Question 6</title>
</head>
<body>
    <h1>Salary calculator</h1>
    <script>
        let salary = 30000;
        let hra = salary * 20 / 100;
        let da = salary * 10 / 100;
        let tax = salary * 8 / 100;
        salary += hra;
        salary += da;
        salary -= tax;
        console.log('Net Salary:'+ salary);
    </script>
</body>
