<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Question 3</title>
</head>
<body>
    <h1>Comparsion Operator</h1>
    <script>
        let a = 10;
        let b = 20;
        console.log('Equal:',a == b);
        console.log('Three Equal:',a === b);
        console.log('Greater:',a > b);
        console.log('Less or equal:',a <= b);
    </script>
</body>
</html>
